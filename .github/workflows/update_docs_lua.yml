name: Update docs.lua and scripts

on:
    schedule:
        - cron: "0 6 * * 0"
    workflow_dispatch: # allow manual trigger

jobs:
    update:
        runs-on: ubuntu-slim
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Download latest docs.lua from ArduPilot master
              run: |
                  curl -fsSL \
                    "https://raw.githubusercontent.com/ArduPilot/ardupilot/master/libraries/AP_Scripting/docs/docs.lua" \
                    -o .checks/docs.lua

            - name: Update applets from ArduPilot master
              run: python scripts/fetch_ardupilot_applets.py

            - name: Apply pre-commit fixers
              run: |
                  pip install -e '.[dev]'
                  pre-commit run --all-files || true

            - name: Commit and push if changed
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add .checks/docs.lua lua/applets
                  git diff --staged --quiet && exit 0
                  git commit -m "chore: update Lua files from ArduPilot master"
                  git push
